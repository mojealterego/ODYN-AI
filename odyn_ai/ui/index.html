<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2E3440"><meta name="description" content="ODYN AI — lokalna inteligencja po polsku.">
  <meta name="description" content="ODYN AI — lokalna inteligencja i agenci AI">
  <title>ODYN AI</title>
  <link rel="stylesheet" href="/static/nord.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">🐦‍⬛ ODYN AI</div>

    <div class="eyebrow">KREATOR AGENTÓW</div>
    <label for="agent-select">Agent</label>
    <select id="agent-select" aria-label="Wybierz agenta"></select>

    <div class="builder">
      <div class="eyebrow">KREATOR APLIKACJI</div>
      <button id="new-agent" type="button">+ Nowy agent</button>
      <button id="new-app" type="button">+ Nowa aplikacja</button>
      <button id="status-btn" type="button">Status silnika</button>
    </div>

    <div id="status" aria-live="polite">Ładowanie…</div>
  </aside>

  <main id="main">
    <header>
      <div>
        <div class="eyebrow">INTELIGENCJA LOKALNA</div>
        <h1>ODYN AI</h1>
      </div>
      <span id="engine-badge">SILNIK</span>
    </header>

    <section id="chat-history" aria-live="polite">
      <div class="message assistant">
        <strong>ODYN AI</strong>
        <p>System gotowy. Wybierz agenta i rozpocznij rozmowę.</p>
      </div>
    </section>

    <form id="chat-form">
      <label class="sr-only" for="user-input">Polecenie</label>
      <textarea id="user-input" rows="1" maxlength="20000" aria-label="Polecenie dla ODYN AI" placeholder="Napisz polecenie do ODYN AI…" aria-label="Polecenie do ODYN AI"></textarea>
      <button id="send-btn" type="submit">Wyślij</button>
    </form>
  </main>

  <dialog id="builder-dialog" aria-labelledby="dialog-title">
    <form method="dialog" id="builder-form">
      <h2 id="dialog-title">Kreator</h2>
      <div id="dialog-fields"></div>
      <div class="dialog-actions">
        <button value="cancel">Anuluj</button>
        <button id="dialog-submit" value="default">Utwórz</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
