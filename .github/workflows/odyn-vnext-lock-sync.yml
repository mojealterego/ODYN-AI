name: ODYN vNext Lock Sync

on:
  push:
    branches:
      - integration/odyn-vnext
    paths:
      - pyproject.toml
      - .github/workflows/odyn-vnext-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.13"
      - name: Regenerate locked dependency graph
        run: uv lock --python 3.14
      - name: Publish lock update
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "odyn-vnext-bot"
          git config user.email "odyn-vnext-bot@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: sync uv lock for ODYN mobile runtime"
          git push origin HEAD:integration/odyn-vnext
