name: ODYN AI CI

on:
  push:
    branches: [codex/odyn-ai]
    paths:
      - "odyn_ai/**"
      - ".github/workflows/odyn-ai.yml"
  pull_request:
    paths:
      - "odyn_ai/**"
      - ".github/workflows/odyn-ai.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pydantic pytest
      - name: Compile ODYN sources
        run: python -m compileall -q odyn_ai
      - name: Run ODYN unit tests
        run: python -m unittest discover -s odyn_ai/tests -v
