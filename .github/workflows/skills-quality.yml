name: Skills Quality

on:
  push:
    paths:
      - "skills/**"
      - "hermes_cli/skill_runtime.py"
      - "tests/test_skill_runtime.py"
      - "scripts/validate_skills.py"
      - ".github/workflows/skills-quality.yml"
  pull_request:
    paths:
      - "skills/**"
      - "hermes_cli/skill_runtime.py"
      - "tests/test_skill_runtime.py"
      - "scripts/validate_skills.py"
      - ".github/workflows/skills-quality.yml"

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Android Agent skill
        run: python scripts/validate_skills.py skills/android-agent --json
      - name: Run Skills runtime tests
        run: python -m unittest discover -s tests -p 'test_skill_runtime.py' -v
